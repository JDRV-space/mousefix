# MouseFix config
# Copy to ~/.config/mousefix/config.yaml
#
# Run `MouseFix discover` if your mouse reports different button numbers.
#
# A modifier by itself is held until that mouse button is released. This lets
# the mouse button combine with a physical keyboard key, such as Cmd + R.
#
# Actions:
#   "Cmd", "Shift"   held modifier
#   "Cmd+Z"          keyboard shortcut
#   "MiddleClick"    native middle click
#   "LaserPointer"   laser pointer circle while held
#   "MissionControl" Mission Control
#   "AppExpose"      current application windows
#   "ShowDesktop"    Show Desktop
#   "None"           disable direct button action

buttons:
  2: "MiddleClick"          # Scroll wheel press
  3: "Cmd+Z"                # Undo
  4: "Cmd"                  # Hold Command and combine with keyboard input
  5: "Cmd+Shift+4"          # Screenshot
  6: "None"                 # Reserved for the gesture engine below

# Tap or hold button 6 while moving the mouse.
gesture:
  button: 6
  click: "Cmd+Tab"
  hold_left: "Ctrl+Right"
  hold_right: "Ctrl+Left"
  hold_up: "MissionControl"
  hold_down: "AppExpose"

# The side wheel sends plain left/right arrow presses.
tilt_scroll:
  left: "Left"
  right: "Right"

# Only events from the configured Logitech mouse are reshaped. Apple trackpad
# events and events from unrelated devices pass through unchanged.
scroll:
  enabled: true
  device: "mx master"
  response: 0.68
  speed: 1.0
  inertia: 0.89

name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report toolchain
        run: swift --version
      - name: Build
        run: swift build --only-use-versions-from-resolved-file
      - name: Run core checks
        run: swift run --only-use-versions-from-resolved-file MouseFixCoreChecks
      - name: Run tests
        run: swift test --only-use-versions-from-resolved-file
      - name: Package app
        run: ./Scripts/package-macos-app.sh
      - name: Verify deployment target
        run: vtool -show-build .build/release/MouseFix.app/Contents/MacOS/MouseFix | grep -F "minos 13.0"
